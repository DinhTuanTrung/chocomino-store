<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="squishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB5CA" />
      <stop offset="50%" stop-color="#F9739B" />
      <stop offset="100%" stop-color="#E24C7C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#E24C7C" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squishy Bubble -->
  <rect width="512" height="512" rx="140" fill="#FFF9F6" />

  <!-- Main Squishy Body -->
  <path d="M 156 120 C 220 80, 292 80, 356 120 C 430 170, 440 280, 410 360 C 370 440, 142 440, 102 360 C 72 280, 82 170, 156 120 Z" 
        fill="url(#squishGrad)" filter="url(#shadow)" />

  <!-- Cute Squishy Ears -->
  <circle cx="170" cy="140" r="32" fill="#FFE8EF" />
  <circle cx="342" cy="140" r="32" fill="#FFE8EF" />

  <!-- Kawaii Eyes -->
  <ellipse cx="206" cy="250" rx="14" ry="20" fill="#5A3A3A" />
  <circle cx="212" cy="242" r="6" fill="#FFFFFF" />

  <ellipse cx="306" cy="250" rx="14" ry="20" fill="#5A3A3A" />
  <circle cx="312" cy="242" r="6" fill="#FFFFFF" />

  <!-- Cute Blushing Cheeks -->
  <ellipse cx="166" cy="286" rx="22" ry="12" fill="#FF8BA7" opacity="0.7" />
  <ellipse cx="346" cy="286" rx="22" ry="12" fill="#FF8BA7" opacity="0.7" />

  <!-- Smile Mouth -->
  <path d="M 238 280 Q 256 304 274 280" fill="none" stroke="#5A3A3A" stroke-width="8" stroke-linecap="round" />

  <!-- Chocolate Sprinkles -->
  <rect x="220" y="150" width="24" height="8" rx="4" fill="#5A3A3A" transform="rotate(25 232 154)" />
  <rect x="280" y="160" width="24" height="8" rx="4" fill="#FFD76A" transform="rotate(-15 292 164)" />
  <rect x="250" y="190" width="20" height="8" rx="4" fill="#9ADFC8" transform="rotate(45 260 194)" />
</svg>
